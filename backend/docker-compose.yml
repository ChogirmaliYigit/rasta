version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rasta_user
      POSTGRES_PASSWORD: rasta_secret_password
      POSTGRES_DB: rasta_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    env_file:
      - .env.example
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info

volumes:
  db_data:
  redis_data:
